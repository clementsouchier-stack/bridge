name: Replace entities with provided index

on:
  push:
    paths:
      - '.github/workflows/push-exact-entities.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install deterministic parser
        run: pip install beautifulsoup4==4.14.3
      - name: Rebuild exact provided file
        shell: bash
        run: |
          git show 6dbb47f5fa3e2cf088ff68e39e55a4a2103a38c1:entities/index.html > /tmp/index-base.html
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import base64,zlib
          SRC=Path('/tmp/index-base.html')
          OUT=Path('entities/index.html')
          html=SRC.read_text(encoding='utf-8',errors='ignore')
          soup=BeautifulSoup(html,'html.parser')
          styles=soup.find_all('style')
          style9=styles[9]
          raw9=style9.string or style9.get_text()
          marker='html,body{height:100%;}'
          idx=raw9.find(marker)
          if idx==-1: raise RuntimeError('Could not locate previous prototype CSS tail')
          style9.string=raw9[:idx].rstrip()+'\n'
          for i in [13,12,11,10]: styles[i].decompose()
          for img in soup.select('img.bridge-artwork'):
              img['width']='220'; img['height']='220'
          css=zlib.decompress(base64.b64decode('')).decode()
          new_style=soup.new_tag('style',id='bridge-entities-ui')
          new_style.string=css
          soup.head.append(new_style)
          OUT.write_text(str(soup),encoding='utf-8')
          PY
          test "$(git hash-object entities/index.html)" = "546605e316967229805bb5798cdc6b048b8a3e8c"
          test "$(sha256sum entities/index.html | cut -d' ' -f1)" = "2f9b7584cffa50475335472dbda26900824bcc51adebcc1c9092e6686c22c29a"
      - name: Commit exact replacement and remove transfer workflow
        shell: bash
        run: |
          rm .github/workflows/push-exact-entities.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entities/index.html .github/workflows/push-exact-entities.yml
          git commit -m "Replace entities index with provided code"
          git push origin HEAD:main
