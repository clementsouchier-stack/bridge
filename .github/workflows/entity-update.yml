name: Apply entities HTML update

on:
  push:
    paths:
      - 'entities/.entity-update/READY'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply exact update
        shell: bash
        run: |
          set -euo pipefail
          expected_old='09178c2a0f693d2c37acd482c601cb147880b3a2'
          expected_new='53d28733b4508e84caa1c8d62591f51706b78b59a4e6313f65598f203846954d'
          test "$(git hash-object entities/index.html)" = "$expected_old"
          cat entities/.entity-update/part-* > /tmp/delta.b64
          base64 -d /tmp/delta.b64 | gzip -d > /tmp/delta.patch
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          b = Path('entities/index.html').read_bytes()
          parts = re.split(b'([<>;{}\n])', b)
          with open('/tmp/old.tokens', 'w') as f:
              for part in parts:
                  if not part:
                      continue
                  for i in range(0, len(part), 512):
                      f.write(base64.b64encode(part[i:i+512]).decode() + '\n')
          PY
          patch /tmp/old.tokens /tmp/delta.patch
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          out = b''.join(base64.b64decode(line.strip()) for line in Path('/tmp/old.tokens').read_text().splitlines() if line.strip())
          expected = '53d28733b4508e84caa1c8d62591f51706b78b59a4e6313f65598f203846954d'
          assert hashlib.sha256(out).hexdigest() == expected
          Path('entities/index.html').write_bytes(out)
          PY
          rm -rf entities/.entity-update
          rm -f .github/workflows/entity-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update entities prototype'
          git push
