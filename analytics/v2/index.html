  </style>
</head>
<body>
<script>
(async () => {
  try {
    const response = await fetch('./base.html?v=20260914-v7', { cache: 'no-store' });
    if (!response.ok) throw new Error(`Failed to load Analytics baseline (${response.status})`);
    let html = await response.text();
    html = html.replace('</body>', '<script src="./enhancements.js?v=20260914-v7"><\\/script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.body.innerHTML = '<main style="padding:24px;font:14px/1.5 Arial,sans-serif">Unable to load Analytics.</main>';
  }
})();
</script>
</body>
