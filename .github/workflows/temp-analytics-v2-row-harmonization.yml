name: Apply analytics row harmonization

on:
  push:
    paths:
      - .github/workflows/temp-analytics-v2-row-harmonization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch analytics v2 rows
        run: python .github/analytics-v2-row-harmonization-patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/v2/index.html
          git commit -m "feat: add track menus and harmonize analytics rows"
          git push
