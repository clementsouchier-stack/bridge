name: Add analytics share detail

on:
  push:
    paths:
      - .github/workflows/temp-analytics-v2-share-detail.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch analytics v2 share detail
        run: python .github/analytics-v2-share-detail-patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/v2/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: open popular shares with activity"
          git push
