name: Refactor analytics v2 cleanly

on:
  push:
    paths:
      - .github/workflows/temp-analytics-v2-clean-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor analytics v2
        run: python .github/analytics-v2-clean-refactor.py
      - name: Commit refactor
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/v2/index.html
          git commit -m "refactor: consolidate analytics v2 overview"
          git push
