<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bridge — Library</title><style>*{box-sizing:border-box}:root{--b:#2f43de;--s:#2f43de0e;--p:#2f43de25;--t:#17181b;--m:#777d86;--bd:#e7e8ea}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--t)}button,input{font:inherit;color:inherit}.desk{height:100dvh;display:grid;grid-template:56px 1fr 64px/96px 1fr;grid-template-areas:'n h' 'n m' 'p p'}.nav{grid-area:n;background:#f7f7f8;border-right:1px solid var(--bd);padding:14px 10px;text-align:center}.brand{width:42px;height:42px;margin:auto;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.ni{margin:12px 0;padding:9px 2px;border-radius:8px;font-size:11px;color:#656b73}.ni.on{background:#e9eafe;color:#1c2aa8;font-weight:700}.head{grid-area:h;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:8px;font-size:14px}.ico{width:26px;height:26px;border-radius:6px;background:#111;color:#fff;display:grid;place-items:center}.main{grid-area:m;overflow:auto;padding:18px 24px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.seg{display:flex;background:#f1f2f4;padding:3px;border-radius:10px}.seg button,.btn{border:0;background:transparent;height:32px;border-radius:8px;padding:0 12px}.seg .on{background:#fff;font-weight:650;box-shadow:0 1px 4px #0001}.btn{height:38px;border:1px solid var(--bd);background:#fff;font-weight:600}.sp{flex:1}.table{min-width:760px}.th,.row{display:grid;grid-template-columns:28px 48px minmax(190px,2fr) minmax(140px,1.4fr) 80px minmax(145px,1fr) 48px;align-items:center}.th{height:38px;font-size:12px;color:var(--m);border-bottom:1px solid var(--bd)}.row{height:52px;border-radius:8px;font-size:13px}.row:hover{background:#f3f4f6}.row[data-s=true]{background:var(--s)}.row[data-x=played]{background:var(--p)}.cover{width:40px;height:40px;border:0;padding:0;border-radius:4px;overflow:hidden;position:relative;background:#e9ebef}.cover img{width:40px;height:40px;object-fit:cover}.ph{display:grid;place-items:center;width:40px;height:40px;color:#888}.shade,.pi{position:absolute;inset:0;opacity:0}.shade{background:#0b0f19}.pi{display:grid;place-items:center;color:#fff}.pi:before{content:'';border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor}.track[data-st=playing] .pi:before{width:12px;height:14px;border:0;background:linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px,currentColor 8px 12px)}@media(hover:hover){.cover:hover .shade{opacity:.34}.cover:hover .pi{opacity:1}}.copy{border:0;background:none;text-align:left;min-width:0;padding:0 8px;display:flex;flex-direction:column}.tl{display:flex;align-items:center;min-width:0}.title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track[data-x=played] .title{color:var(--b)}.artist{font-size:12px;color:var(--m);margin-top:2px}.eq{display:none;align-items:flex-end;gap:1.5px;width:11px;height:12px;margin-left:5px}.track[data-x=played] .eq{display:flex}.eq i{width:2px;height:5px;background:var(--b);border-radius:2px}.track[data-st=playing] .eq i:nth-child(1){animation:a .6s infinite alternate}.track[data-st=playing] .eq i:nth-child(2){animation:b .5s infinite alternate}.track[data-st=playing] .eq i:nth-child(3){animation:a .7s infinite alternate}@keyframes a{to{height:11px}}@keyframes b{from{height:10px}to{height:4px}}.dots{border:0;background:none}.player{grid-area:p;border-top:1px solid var(--bd);display:grid;grid-template-columns:48px 1fr 52px 46px;align-items:center;gap:8px;padding:6px 16px;background:#fff}.pa{width:40px;height:40px;border-radius:4px;overflow:hidden;background:#eee}.pa img{width:40px;height:40px;object-fit:cover}.pt{font-size:13px;font-weight:700}.ar{font-size:12px;color:var(--m)}.ptg{border:0;background:none;height:40px}.mob{display:none;height:100dvh;grid-template-rows:56px auto 1fr 72px}.mh{display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--bd)}.mc{padding:10px 16px;border-bottom:1px solid var(--bd)}.ml{overflow:auto;padding:0 8px}.mr{height:64px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-radius:8px}.mr[data-s=true]{background:var(--s)}.mr[data-x=played]{background:var(--p)}.mr .copy{height:64px}@media(hover:none),(pointer:coarse){.track[data-st=playing] .shade{opacity:.34}.track[data-st=playing] .pi{opacity:1}}@media(max-width:767px){.desk{display:none}.mob{display:grid}}@media(min-width:768px){.desk{display:grid}.mob{display:none}}</style></head><body><div class=desk><aside class=nav><div class=brand>B</div><div class="ni on">♫<br>Library</div><div class=ni>▰<br>Projects</div><div class=ni>↗<br>Shared</div><div class=ni>↓<br>Received</div><div class=ni>◔<br>Analytics</div></aside><header class=head><span class=ico>♫</span>/ <b>Tracks</b></header><main class=main><div class=bar><div class=seg><button class=on>Standard</button><button>Prompt</button><button>Similarity</button></div><button class=btn>Tracks⌄</button><button class=btn>Filter</button><button class=btn>Sort</button><span class=sp></span></div><div class=table><div class=th><span></span><span></span><span>Title</span><span>Release</span><span>Duration</span><span>Added</span><span></span></div><div id=dr></div></div></main><footer class=player><div class=pa></div><div><div class=pt></div><div class=ar></div></div><button class=ptg></button><button class=dots>•••</button></footer></div><div class=mob><header class=mh>☰ <span class=ico>♫</span>/ <b>Tracks</b></header><section class=mc><div class=seg><button class=on>Standard</button><button>Prompt</button><button>Similarity</button></div><div style="margin-top:9px"><button class=btn>Tracks⌄</button> <button class=btn>Filter</button> <button class=btn>Sort</button></div></section><main class=ml id=mr></main><footer class=player><div
