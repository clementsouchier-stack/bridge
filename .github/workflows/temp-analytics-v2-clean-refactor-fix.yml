name: Refactor analytics v2 cleanly fix

on:
  push:
    paths:
      - .github/workflows/temp-analytics-v2-clean-refactor-fix.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix migration substitution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/analytics-v2-clean-refactor.py')
          s = p.read_text()
          old = "text, count = pattern.subn('\\n' + clean_script, text, count=1)"
          new = "text, count = pattern.subn(lambda _: '\\n' + clean_script, text, count=1)"
          if old not in s:
              raise SystemExit('migration line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Refactor analytics v2
        run: python .github/analytics-v2-clean-refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/v2/index.html .github/analytics-v2-clean-refactor.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: consolidate analytics v2 overview"
          git push
