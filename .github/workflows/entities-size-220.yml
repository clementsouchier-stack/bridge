name: Update entities artwork to 220

on:
  push:
    paths:
      - '.github/workflows/entities-size-220.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update entity artwork sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('entities/index.html')
          s = p.read_text()
          replacements = [
              ('.bridge-artwork-slot{position:relative;z-index:5;width:176px;height:176px;flex:0 0 176px;margin-top:8px;margin-bottom:10px;}',
               '.bridge-artwork-slot{position:relative;z-index:5;width:220px;height:220px;flex:0 0 220px;margin-top:8px;margin-bottom:10px;}'),
              ('.bridge-has-cover .bridge-artwork-slot{margin-top:-78px;}',
               '.bridge-has-cover .bridge-artwork-slot{margin-top:-98px;}'),
              ('.bridge-artwork{width:176px;height:176px;object-fit:cover;',
               '.bridge-artwork{width:220px;height:220px;object-fit:cover;'),
              ('.bridge-artwork-slot{width:120px!important;height:120px!important;flex-basis:120px!important;margin-top:8px!important;margin-bottom:10px!important;}',
               '.bridge-artwork-slot{width:140px!important;height:140px!important;flex-basis:140px!important;margin-top:8px!important;margin-bottom:10px!important;}'),
              ('.bridge-artwork{width:120px!important;height:120px!important;}',
               '.bridge-artwork{width:140px!important;height:140px!important;}'),
              ('.bridge-has-cover .bridge-artwork-slot{margin-top:-50px!important;}',
               '.bridge-has-cover .bridge-artwork-slot{margin-top:-58px!important;}'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/entities-size-220.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entities/index.html .github/workflows/entities-size-220.yml
          git commit -m 'Set entity artwork to 220px'
          git push
