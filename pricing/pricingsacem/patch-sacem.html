<style>
/* Sacem Cloud partner offer: deliberately secondary to the standard Bridge plans. */
.partner-plan-divider{display:flex;align-items:center;gap:10px;margin:16px 2px 7px;color:var(--muted);font-size:9px;line-height:1;font-weight:700;letter-spacing:.105em;text-transform:uppercase}.partner-plan-divider::before,.partner-plan-divider::after{content:"";height:1px;flex:1 1 auto;background:rgba(37,36,40,.08)}.partner-plan-divider span{white-space:nowrap;opacity:.58}
.pricing-plan.sacem-plan{--plan-color:#fff6f8!important;--plan-text:#252428!important;min-height:56px;padding:10px 13px;gap:12px;border-color:rgba(217,0,76,.18);border-radius:14px;background:linear-gradient(180deg,#fff,rgba(217,0,76,.018));box-shadow:none;overflow:hidden}.pricing-plan.sacem-plan:not(.is-expanded){align-items:center}.pricing-plan.sacem-plan:not(.is-expanded):hover{transform:none;border-color:rgba(217,0,76,.42);box-shadow:0 3px 0 rgba(217,0,76,.16);background:#fff}.pricing-plan.sacem-plan.is-expanded{padding:15px 16px;border-color:rgba(217,0,76,.34);background:linear-gradient(180deg,rgba(217,0,76,.035),#fff 60%)}.pricing-plan.sacem-plan.selected{border:1px solid #D9004C!important;box-shadow:3px 3px 0 rgba(217,0,76,.22)!important}
.sacem-collapsed-main{display:flex;align-items:center;min-width:0;gap:11px}.sacem-mini-logo{display:block;width:46px;height:auto;flex:0 0 auto;object-fit:contain}.sacem-collapsed-copy{min-width:0}.sacem-collapsed-title{color:var(--text);font-size:13px;line-height:1.1;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sacem-collapsed-subtitle{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.2}.sacem-collapsed-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex:0 0 auto}.sacem-collapsed-price{color:var(--text);font-size:13px;line-height:1;font-weight:700;white-space:nowrap}.sacem-chevron{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid rgba(217,0,76,.16);border-radius:999px;background:#f4f4f5;color:#77747d;font-size:14px;line-height:1;transition:transform .16s ease,background .16s ease}.sacem-plan.is-expanded .sacem-chevron{transform:rotate(180deg);background:#FFF3F7;color:#D9004C}.sacem-expanded-content{display:none;width:100%}.sacem-plan.is-expanded .sacem-expanded-content{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.sacem-plan.is-expanded .sacem-collapsed-main,.sacem-plan.is-expanded .sacem-collapsed-right{display:none}.sacem-expanded-left{min-width:0}.sacem-expanded-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}.sacem-expanded-brand .sacem-mini-logo{width:58px}.sacem-expanded-kicker{color:#D9004C;font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase}.sacem-expanded-title{font-size:18px;font-weight:700;line-height:1.06;letter-spacing:-.035em}.sacem-expanded-note{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.35}.sacem-expanded-price{text-align:right;flex:0 0 auto}.sacem-expanded-price .pricing-plan-notice{margin-bottom:5px;color:#D9004C}.sacem-plan .pricing-plan-price-value{font-size:27px}
.selected-plan.sacem-theme{--active:#D9004C!important;--active-rgb:217,0,76!important;--active-text:#fff!important;border-color:rgba(217,0,76,.25);box-shadow:0 1px 0 rgba(217,0,76,.04)}.selected-plan.sacem-theme .selected-plan-header{background:#D9004C;justify-content:space-between;gap:12px}.selected-plan.sacem-theme .selected-plan-header .sacem-summary-logo{display:block;width:84px;max-width:24%;height:auto;object-fit:contain;margin-left:10px;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(1px 1px 0 #fff) drop-shadow(-1px 1px 0 #fff) drop-shadow(1px -1px 0 #fff) drop-shadow(-1px -1px 0 #fff)}.selected-plan.sacem-theme .selected-plan-title{justify-content:flex-start;text-align:left}.selected-plan.sacem-theme .checkout-cta{background:#D9004C!important;border-color:#D9004C!important;color:#fff!important}.selected-plan.sacem-theme .summary-icon{background:rgba(217,0,76,.09)!important}.sacem-fixed-summary{display:grid;gap:0}.sacem-fixed-summary .checkout-size-line + .checkout-size-line{border-top:1px solid rgba(37,36,40,.06)}.sacem-fixed-summary .checkout-size-line img{width:18px;height:18px;flex:0 0 auto}
.compare-plan-pill.supervisor{background:#FF3364!important}
@media(max-width:620px){.partner-plan-divider{margin-top:14px}.pricing-plan.sacem-plan{padding:10px 12px}.sacem-mini-logo{width:40px}.sacem-collapsed-title{font-size:12.5px}.sacem-collapsed-subtitle{display:none}.sacem-collapsed-price{font-size:12px}.sacem-plan.is-expanded .sacem-expanded-content{align-items:flex-start;flex-direction:column}.sacem-expanded-price{text-align:left}.selected-plan.sacem-theme .selected-plan-header .sacem-summary-logo{width:72px;max-width:28%}}
</style>
<script>
(()=>{
 document.title='Bridge Pricing · Sacem Cloud by Bridge.audio';
 const sacemLogo='sacem-cloud-logo.png';
 plans.push({
  id:'sacem',badge:'SACEM MEMBER BENEFIT',color:'#D9004C',rgb:'217,0,76',text:'#fff',
  title:'Sacem Cloud by Bridge.audio',loved:'EXCLUSIVE TO SACEM MEMBERS',cta:'Choose Sacem Cloud',
  partner:true, yearlyMonthly:1.99, monthlyPrice:2.50,
  size:{key:'SACEM',yearly:1.99,monthly:2.50,storage:'50 GB',tracks:'50 tracks',members:'3',slots:'0'},
  common:[
   ['cloud','Storage & media',['50 GB storage - 50 tracks','All media formats']],
   ['search','Search & tagging',['Standard search','Genre auto-tagging']],
   ['paper','Organize & share',['Projects','Links & email sharing','Inbox']],
   ['team','Team',['3 members included']],
   ['eye','Hubs',['No Bridge Hubs included']]
  ]
 });
 state.partnerExpanded=false;
 function renderSacemSummary(p){const s=p.size;return `<div class="sacem-fixed-summary"><div class="checkout-size-line">${optIcon('cloud')}<span>${s.storage} storage - ${s.tracks}</span></div><div class="checkout-size-line">${optIcon('team')}<span>${s.members} members included</span></div><div class="checkout-size-line">${optIcon('eye')}<span>No Bridge Hubs included</span></div></div>`}
 const baseSelectedPrice=selectedPrice;
 selectedPrice=function(){const p=currentPlan();if(p.partner)return state.yearly?p.yearlyMonthly:p.monthlyPrice;return baseSelectedPrice()};
 const baseRenderCheckoutStack=renderCheckoutStack;
 renderCheckoutStack=function(p){
  if(!p.partner)return baseRenderCheckoutStack(p);
  const val=selectedPrice();
  const price=`${val.toFixed(2).replace('.',',')}€`;
  const yearlyLine=state.yearly?`${(p.yearlyMonthly*12).toFixed(2).replace('.',',')}€/year billed yearly`:`${(p.monthlyPrice*12).toFixed(2).replace('.',',')}€/year billed monthly`;
  return `<div class="checkout-stack">${renderSacemSummary(p)}<div class="checkout-bottom"><div class="checkout-price"><div class="checkout-price-main"><span class="checkout-price-value" aria-live="polite">${price}</span><span class="checkout-price-suffix">/mo</span></div><div class="checkout-price-yearly">${yearlyLine}</div></div><div class="checkout-cta-wrap"><button class="pricing-plan-sign-up checkout-cta" id="mainCta">${p.cta}</button><div class="checkout-reassurance">Reserved for verified SACEM members</div></div></div></div>`;
 };
 renderPlans=function(){
  const root=document.getElementById('plans');root.setAttribute('role','radiogroup');root.setAttribute('aria-label','Choose your Bridge plan');
  root.innerHTML=plans.map((p,i)=>{
   if(p.partner){const expanded=state.partnerExpanded;const currentPrice=(state.yearly?p.yearlyMonthly:p.monthlyPrice).toFixed(2).replace('.',',');return `<div class="partner-plan-divider" aria-hidden="true"><span>For SACEM members</span></div><button type="button" class="pricing-plan sacem-plan ${expanded?'is-expanded ':''}${i===state.plan?'selected':''}" role="radio" data-plan-id="${p.id}" aria-checked="${i===state.plan}" aria-expanded="${expanded}" tabindex="${i===state.plan?'0':'-1'}" data-i="${i}" style="--plan-color:${p.color};--plan-text:${p.text}"><div class="sacem-collapsed-main"><img class="sacem-mini-logo" src="${sacemLogo}" alt="SACEM Bridge.audio"><div class="sacem-collapsed-copy"><div class="sacem-collapsed-title">Sacem Cloud by Bridge.audio</div><div class="sacem-collapsed-subtitle">Exclusive member offer</div></div></div><div class="sacem-collapsed-right"><div class="sacem-collapsed-price">${currentPrice}€ /mo</div><span class="sacem-chevron" aria-hidden="true">⌄</span></div><div class="sacem-expanded-content"><div class="sacem-expanded-left"><div class="sacem-expanded-brand"><img class="sacem-mini-logo" src="${sacemLogo}" alt="SACEM Bridge.audio"><div><div class="sacem-expanded-kicker">SACEM member benefit</div><div class="sacem-expanded-title">Sacem Cloud by Bridge.audio</div></div></div><div class="sacem-expanded-note">50 GB · 50 tracks · 3 members · No Hubs</div></div><div class="sacem-expanded-price"><div class="pricing-plan-notice">Member price</div><div class="pricing-plan-price-main"><span class="pricing-plan-price-value">${currentPrice}€</span><span class="pricing-plan-price-suffix">/mo</span></div><div class="pricing-plan-price-yearly">${state.yearly?'billed yearly':'billed monthly'}</div></div></div></button>`}
   return `<button type="button" class="pricing-plan ${i===state.plan?'selected':''}" role="radio" data-plan-id="${p.id}" aria-checked="${i===state.plan}" tabindex="${i===state.plan?'0':'-1'}" data-i="${i}" style="--plan-color:${p.color};--plan-text:${p.text}"><div class="pricing-plan-main"><div class="pricing-plan-name">${p.sizes?diamond():''}${p.badge}</div><div class="pricing-plan-title">${p.title}</div><div class="pricing-plan-lovedby">${p.loved}</div></div><div class="right"><div class="pricing-plan-notice">${p.enterprise?'Tailored plan':p.free?'':'Starting at'}</div><div class="pricing-plan-price-main"><span class="pricing-plan-price-value">${priceText(p)}</span>${p.sizes?'<span class="pricing-plan-price-suffix">/mo</span>':''}</div>${p.sizes?`<div class="pricing-plan-price-yearly">${state.yearly?'billed yearly':'billed monthly'}</div>`:''}</div></button>`
  }).join('');
  [...root.querySelectorAll('.pricing-plan')].forEach(el=>{const i=Number(el.dataset.i);const select=()=>{const p=plans[i];if(p.partner){state.partnerExpanded=!state.partnerExpanded;if(state.partnerExpanded){state.plan=i;state.size=0}render();if(state.partnerExpanded)positionCheckout();return}state.partnerExpanded=false;state.plan=i;state.size=0;render();positionCheckout()};el.addEventListener('click',select);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();return}if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();focusPlan((i+1)%plans.length)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();focusPlan((i-1+plans.length)%plans.length)}})});
 };
 renderSummary=function(){const p=currentPlan();const summary=document.getElementById('summary');summary.style.setProperty('--active',p.color);summary.style.setProperty('--active-rgb',p.rgb);summary.style.setProperty('--active-text',p.text);summary.classList.toggle('free-theme',p.id==='free');summary.classList.toggle('sacem-theme',p.id==='sacem');summary.innerHTML=`<div class="selected-plan-header"><div class="selected-plan-title">${p.partner?'Sacem Cloud by Bridge.audio':`${p.sizes?diamond():''}${p.badge}`}</div>${p.partner?`<img class="sacem-summary-logo" src="${sacemLogo}" alt="SACEM Bridge.audio">`:''}</div><div class="selected-plan-intro"><div class="selected-plan-subtitle">${p.title}</div><div class="selected-plan-loved">${p.loved}</div></div><div class="selected-plan-body"><div class="selected-plan-details">${renderFeatures(p)}</div></div>${renderCheckoutStack(p)}`;bindSizeKeys();document.getElementById('mainCta').onclick=()=>alert('Demo action')};
 render();
})();
</script>
