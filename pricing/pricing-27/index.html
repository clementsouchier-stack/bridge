<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge Pricing</title></head><body><script>(async()=>{const baseFiles=['part1.txt','part2.txt','part3.txt','part4.txt'];const [baseParts,patch]=await Promise.all([Promise.all(baseFiles.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()}))),fetch('patch-v152.html').then(r=>{if(!r.ok)throw new Error('patch-v152.html');return r.text()})]);let html=baseParts.join('');html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Unable to load pricing prototype.</p>'})</script></body></html>
