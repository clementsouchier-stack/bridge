<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge Pricing</title></head><body><script>(async()=>{const files=['part1.txt','part2.txt','part3.txt','part4.txt'];const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.open();document.write(parts.join(''));document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Unable to load pricing prototype.</p>'})</script></body></html>
