<style>
/* v15.2 */
.ecosystem-logo-grid{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px!important;margin-top:16px!important}
.ecosystem-logo-grid img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border:1px solid var(--border);border-radius:10px;background:#fff}
.compare-table{width:100%;border-collapse:separate;border-spacing:0}
.compare-table th,.compare-table td{text-align:center!important;vertical-align:middle!important}
.compare-table .compare-feature{text-align:left!important}
.compare-plan-pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:7px 10px;border-radius:999px;font-size:10px;line-height:1;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.compare-plan-pill.free{background:#e7e7e9;color:#252428}.compare-plan-pill.talent{background:#ffc833;color:#252428}.compare-plan-pill.music{background:#2f43de;color:#fff}.compare-plan-pill.supervisor{background:#ff3364;color:#fff}.compare-plan-pill.enterprise{background:#252428;color:#fff}
.compare-yes{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:#2f43de;color:#fff;font-size:13px;font-weight:800;line-height:1}
.compare-no{color:#aaa8af;font-size:18px;line-height:1;font-weight:500}
.compare-table tbody td:not(.compare-feature){font-size:11.5px;line-height:1.3;font-weight:600}.compare-table tbody tr:not(.compare-family):hover td{background:#fafafa}
.selected-plan-header .selected-plan-title{font-size:13px!important;line-height:1!important}
.checkout-free-summary{display:grid;gap:0}.checkout-free-summary .checkout-size-line{display:flex;align-items:center;gap:9px;min-height:34px;padding:7px 0;color:var(--text);font-size:13px;line-height:1.25;font-weight:700}.checkout-free-summary .checkout-size-line+.checkout-size-line{border-top:1px solid rgba(37,36,40,.06)}.checkout-free-summary .checkout-size-line img{width:18px;height:18px;flex:0 0 auto}
@media(min-width:901px){.checkout-stack{padding-right:25px!important}.checkout-bottom{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px}.checkout-cta-wrap{justify-self:end;margin:0!important}.checkout-cta{width:auto!important;min-width:190px;margin:0!important}.checkout-reassurance{margin:7px 0 0!important;text-align:center}}
</style>
<script>
(()=>{
const proof=`<section aria-label="Bridge.audio ecosystem proof" class="ecosystem-proof"><p class="ecosystem-proof-kicker">BRIDGE.AUDIO ECOSYSTEM</p><h3>Bridge the gap within the music industry and beyond.</h3><div class="ecosystem-proof-stats"><div class="ecosystem-stat"><div class="ecosystem-stat-number">50K+</div><div class="ecosystem-stat-title">Creators &amp; artists</div><div class="ecosystem-stat-copy">Artists, composers, voice-over and independent creative teams.</div><div aria-label="Artists using Bridge.audio" class="ecosystem-logo-grid">${[1,2,3,4,5].map(i=>`<img src="https://www.bridge.audio/images/pricing/creators/${i}.png" alt="">`).join('')}</div></div><div class="ecosystem-stat"><div class="ecosystem-stat-number">5K+</div><div class="ecosystem-stat-title">Music professionals</div><div class="ecosystem-stat-copy">Labels, publishers, managers, brokers and rights holders.</div><div aria-label="Music professionals using Bridge.audio" class="ecosystem-logo-grid">${[1,2,3,4,5].map(i=>`<img src="https://www.bridge.audio/images/pricing/professionals/${i}.jpg" alt="">`).join('')}</div></div><div class="ecosystem-stat"><div class="ecosystem-stat-number">600+</div><div class="ecosystem-stat-title">Buyers &amp; creative teams</div><div class="ecosystem-stat-copy">Supervisors, agencies, brands, broadcasters and media teams searching for music.</div><div aria-label="Buyer network examples" class="ecosystem-logo-grid">${[1,2,3,4,5].map(i=>`<img src="https://www.bridge.audio/images/pricing/buyers/${i}.jpg" alt="">`).join('')}</div></div></div></section>`;
const oldProof=document.querySelector('.ecosystem-proof');if(oldProof)oldProof.outerHTML=proof;
window.compareValue=function(v){if(v==='Yes')return `<span class="compare-yes" aria-label="Yes">✓</span>`;if(v==='No')return `<span class="compare-no" aria-label="No">—</span>`;return v};
window.renderCompare=function(){const t=document.getElementById('compareTable');t.innerHTML=`<thead><tr><th class="compare-feature">Feature</th><th><span class="compare-plan-pill free">Free</span></th><th><span class="compare-plan-pill talent">Talent Pro</span></th><th><span class="compare-plan-pill music">Music Pro</span></th><th><span class="compare-plan-pill supervisor">Supervisor / Media Pro</span></th><th><span class="compare-plan-pill enterprise">Enterprise</span></th></tr></thead><tbody>${compareRows.map(([family,feature,vals])=>{const familyRow=family?`<tr class="compare-family"><td colspan="6">${family}</td></tr>`:'';return `${familyRow}<tr><td class="compare-feature">${feature}</td>${vals.map(v=>`<td>${compareValue(v)}</td>`).join('')}</tr>`}).join('')}</tbody>`};
window.renderFreeSummary=function(p){const s=p.size;return `<div class="checkout-free-summary"><div class="checkout-size-line">${optIcon('cloud')}<span>${s.storage} storage - ${s.tracks}</span></div><div class="checkout-size-line">${optIcon('team')}<span>${s.members} members included</span></div><div class="checkout-size-line">${optIcon('eye')}<span>0 tracks published on Bridge Hubs</span></div></div>`};
window.renderCheckoutStack=function(p){const val=selectedPrice();const price=p.enterprise?'Custom':p.free?'Free':fmt(val);const suffix=p.sizes?'/mo':'';const yearlyLine=p.sizes?(state.yearly?`${fmt(val*12)}/year billed yearly`:`${fmt(val*12)}/year billed monthly`):(p.enterprise?'Talk to sales':'');const sizes=p.sizes?`<div class="checkout-size-tabs" role="tablist" aria-label="${p.badge} sizes">${p.sizes.map((x,i)=>`<button type="button" class="checkout-size-tab" role="tab" aria-selected="${i===state.size}" tabindex="${i===state.size?'0':'-1'}" data-size="${i}">${x.key}</button>`).join('')}</div>${checkoutSizeLines(p,p.sizes[state.size])}`:(p.free?renderFreeSummary(p):'');return `<div class="checkout-stack">${sizes}<div class="checkout-bottom"><div class="checkout-price"><div class="checkout-price-main"><span class="checkout-price-value" aria-live="polite">${price}</span>${suffix?`<span class="checkout-price-suffix">${suffix}</span>`:''}</div>${yearlyLine?`<div class="checkout-price-yearly">${yearlyLine}</div>`:''}</div><div class="checkout-cta-wrap"><button class="pricing-plan-sign-up checkout-cta ${p.enterprise?'secondary':''}" id="mainCta">${p.cta}</button><div class="checkout-reassurance">${p.free?'No card required':p.sizes?'Cancel anytime':''}</div></div></div></div>`};
renderSummary();renderCompare();
})();
</script>
