name: Finalize analytics v2 data refactor

on:
  push:
    paths:
      - .github/workflows/temp-analytics-v2-static-data-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Finalize analytics v2 data model
        run: python .github/analytics-v2-static-data-refactor.py
      - name: Commit final refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/v2/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: remove legacy analytics data markup"
          git push
