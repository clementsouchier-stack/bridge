name: Apply exact opened project reference

on:
  push:
    paths:
      - .github/workflows/temp-analytics-v2-exact-project.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Apply exact source DOM
        run: python .github/analytics-v2-exact-project-patch.py
      - name: Commit exact project view
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/v2/index.html
          git commit -m "refactor: use exact project page source for analytics share" || exit 0
          git push
