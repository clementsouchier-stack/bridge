<style>
.ecosystem-logo-grid{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px!important;margin-top:16px!important}.ecosystem-logo-grid img{display:block;width:100%;height:42px!important;padding:5px;object-fit:contain!important;border:1px solid rgba(37,36,40,.08)!important;border-radius:10px;background:#fff;opacity:.68!important;filter:grayscale(1)}.ecosystem-stat:hover .ecosystem-logo-grid img{opacity:.82!important}.ecosystem-proof{box-shadow:none!important}.ecosystem-stat{min-height:190px!important}.ecosystem-stat-number{font-size:36px!important}.ecosystem-stat-title{font-size:15px!important}.ecosystem-stat-copy{font-size:12px!important;line-height:1.4!important}
.compare-table{width:100%;border-collapse:separate;border-spacing:0}.compare-table th,.compare-table td{text-align:center!important;vertical-align:middle!important}.compare-table .compare-feature{text-align:left!important;min-width:190px;font-weight:650;color:var(--text)}.compare-plan-pill{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:7px 10px;border-radius:999px;font-size:10px;line-height:1;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}.compare-plan-pill.free{background:#e7e7e9;color:#252428}.compare-plan-pill.talent{background:#ffc833;color:#252428}.compare-plan-pill.music{background:#2f43de;color:#fff}.compare-plan-pill.supervisor{background:#ff3364;color:#fff}.compare-plan-pill.enterprise{background:#252428;color:#fff}.compare-yes{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:#2f43de;color:#fff;font-size:13px;font-weight:800;line-height:1}.compare-no{color:#aaa8af;font-size:18px;line-height:1;font-weight:500}.compare-table tbody td:not(.compare-feature){font-size:11.5px;line-height:1.3;font-weight:600}.compare-table tbody tr:not(.compare-family):hover td{background:#fafafa}.compare-family td{padding-top:18px!important;padding-bottom:8px!important;color:var(--muted)!important;font-size:10px!important;font-weight:800!important;letter-spacing:.1em!important;text-transform:uppercase}.compare-secondary{display:none}.compare-expanded .compare-secondary{display:table-row}.compare-more-btn{display:block;margin:18px auto 0;min-height:40px;padding:9px 15px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--text);font-size:12px;font-weight:700;cursor:pointer}.compare-more-btn:hover{border-color:#252428}.compare-table thead th{position:sticky;top:0;z-index:3;background:#fff}
.selected-plan-header{min-height:44px;padding:12px 18px!important}.selected-plan-header .selected-plan-title{font-size:13px!important;line-height:1!important;letter-spacing:.055em!important}.selected-plan-intro{padding-top:15px!important;padding-bottom:9px!important}.selected-plan-intro .selected-plan-subtitle{font-size:16px!important;line-height:1.2!important}.selected-plan-intro .selected-plan-loved{margin-top:6px!important;font-size:8.5px!important;line-height:1.25!important;letter-spacing:.07em!important}.selected-plan-details .recap-feature{padding:8px 0!important}.recap-feature-title{font-size:12.5px!important}.recap-feature-list li{font-size:11.5px!important;line-height:1.28!important}
.checkout-free-summary{display:grid;gap:0}.checkout-free-summary .checkout-size-line{display:flex;align-items:center;gap:9px;min-height:34px;padding:7px 0;color:var(--text);font-size:13px;line-height:1.25;font-weight:700}.checkout-free-summary .checkout-size-line+.checkout-size-line{border-top:1px solid rgba(37,36,40,.06)}.checkout-free-summary .checkout-size-line img{width:18px;height:18px;flex:0 0 auto}.checkout-size-line strong{color:var(--text);font-weight:800}.checkout-size-line{font-size:13px}
@media(min-width:901px){.selected-plan{height:auto!important;min-height:0!important;max-height:calc(100vh - 48px)!important}.selected-plan-body{flex:0 1 auto!important;overflow-y:auto!important}.checkout-stack{padding-left:22px!important;padding-right:24px!important}.checkout-bottom{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px}.checkout-cta-wrap{justify-self:end!important;margin:0!important}.checkout-cta{width:auto!important;min-width:190px;margin:0!important}.checkout-reassurance{margin:7px 0 0!important;text-align:center}}
@media(max-width:900px){.pricing-section{grid-template-columns:minmax(0,1fr)!important}.selected-plan{height:auto!important;min-height:0!important;max-height:none!important}.selected-plan-body{overflow:visible!important}.checkout-stack{position:sticky;bottom:0;z-index:12;padding:12px 16px 14px!important;box-shadow:0 -10px 24px rgba(37,36,40,.08)}.checkout-bottom{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}.checkout-cta{min-width:160px;margin:0!important}.checkout-reassurance{margin:6px 0 0!important}.compare-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.compare-table{min-width:860px}.compare-table .compare-feature{position:sticky;left:0;z-index:2;background:#fff;box-shadow:1px 0 0 var(--border)}.compare-table thead .compare-feature{z-index:4}}
@media(max-width:620px){.selected-plan-header{min-height:42px;padding:11px 14px!important}.selected-plan-header .selected-plan-title{font-size:12.5px!important}.selected-plan-intro{padding:13px 16px 7px!important}.selected-plan-intro .selected-plan-subtitle{font-size:15px!important}.checkout-stack{padding:10px 14px 12px!important}.checkout-size-tabs{gap:4px!important}.checkout-size-tab{padding:8px 6px!important}.checkout-size-line{min-height:32px!important;padding:6px 0!important;font-size:12.5px}.checkout-bottom{grid-template-columns:1fr!important}.checkout-cta-wrap{width:100%}.checkout-cta{width:100%!important;min-width:0}.ecosystem-logo-grid img{height:36px!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*{transition:none!important;animation:none!important}}
</style>
<script>
(()=>{
const proof=`<section aria-label="Bridge.audio ecosystem proof" class="ecosystem-proof"><p class="ecosystem-proof-kicker">BRIDGE.AUDIO ECOSYSTEM</p><h3>Bridge the gap within the music industry and beyond.</h3><div class="ecosystem-proof-stats"><div class="ecosystem-stat"><div class="ecosystem-stat-number">50K+</div><div class="ecosystem-stat-title">Creators &amp; artists</div><div class="ecosystem-stat-copy">Artists, composers, voice-over and independent creative teams.</div><div aria-label="Artists using Bridge.audio" class="ecosystem-logo-grid">${[1,2,3,4,5].map(i=>`<img src="https://www.bridge.audio/images/pricing/creators/${i}.png" alt="">`).join('')}</div></div><div class="ecosystem-stat"><div class="ecosystem-stat-number">5K+</div><div class="ecosystem-stat-title">Music professionals</div><div class="ecosystem-stat-copy">Labels, publishers, managers, brokers and rights holders.</div><div aria-label="Music professionals using Bridge.audio" class="ecosystem-logo-grid">${[1,2,3,4,5].map(i=>`<img src="https://www.bridge.audio/images/pricing/professionals/${i}.jpg" alt="">`).join('')}</div></div><div class="ecosystem-stat"><div class="ecosystem-stat-number">600+</div><div class="ecosystem-stat-title">Buyers &amp; creative teams</div><div class="ecosystem-stat-copy">Supervisors, agencies, brands, broadcasters and media teams searching for music.</div><div aria-label="Buyer network examples" class="ecosystem-logo-grid">${[1,2,3,4,5].map(i=>`<img src="https://www.bridge.audio/images/pricing/buyers/${i}.jpg" alt="">`).join('')}</div></div></div></section>`;const oldProof=document.querySelector('.ecosystem-proof');if(oldProof)oldProof.outerHTML=proof;
const setCommon=(id,common)=>{const p=plans.find(x=>x.id===id);if(p)p.common=common};
setCommon('free',[['cloud','Media',['All media formats']],['search','Search & tagging',['Standard search','Genre auto-tagging']],['paper','Organize & share',['Projects','Links & email','Inbox']],['eye','Discovery',['No Hub publishing']]]);
setCommon('talent',[['cloud','Media',['All media formats']],['search','Search & tagging',['Standard + Prompt search','Advanced auto-tagging']],['paper','Organize & share',['Projects','Advanced sharing','Inbox','Analytics']],['eye','Discovery',['Publish + browse Bridge Talent']]]);
setCommon('music',[['cloud','Media',['All media formats']],['search','Search & tagging',['Standard + Prompt search','Advanced auto-tagging']],['paper','Organize & share',['Projects','Advanced sharing','Inbox','Analytics']],['eye','Discovery',['Publish on Bridge Hubs','Browse Bridge Talent']]]);
setCommon('supervisor',[['cloud','Media',['All media formats']],['search','Search & tagging',['Standard + Prompt search','Advanced auto-tagging']],['paper','Organize & share',['Projects','Advanced sharing','Inbox','Analytics']],['eye','Discovery',['Browse Talent, Sync, Library & Score']]]);
setCommon('enterprise',[['cloud','Media',['Custom storage','All media formats']],['search','Search & tagging',['Custom search & AI']],['paper','Organize & share',['Custom workflows','Advanced permissions']],['team','Support & integrations',['Custom ingestion','API + SSO']]]);
const rename={'Cloud Storage':'Storage','Music / Audio Storage':'Tracks','Hub promotion slots':'Tracks published','Beautiful Projects to Share':'Projects','Sharing Options':'Sharing','Sub-Projects':'Sub-projects','Replace Audio-File':'Replace audio','Dark Mode':'Dark mode','Upload all formats':'All media formats','Chatbot / Email':'Chatbot / email','Auto-tagging Genre':'Genre auto-tagging','Auto-tagging Language, Themes, Explicit':'Advanced auto-tagging','Host all media':'All media formats'};compareRows.forEach(r=>{if(rename[r[1]])r[1]=rename[r[1]];if(r[1]==='Password on shared')r[2][1]='No / No / Yes';if(r[1]==='Premium ingestion')r[2][1]='No / No / Yes'});
window.checkoutSizeLines=function(p,s){const storage=s.tracks==='Unlimited'?`<strong>${s.storage}</strong> storage - <strong>Unlimited</strong> tracks`:`<strong>${s.storage}</strong> storage - <strong>${s.tracks}</strong>`;const members=`<strong>${s.members}</strong> members included`;let hubs='';if(p.id==='talent'){const n=String(s.slots).replace(/\s*slots?/ig,'').trim();hubs=`<strong>${n}</strong> tracks published on Bridge Talent`;}else if(p.id==='music'){const n=String(s.slots).replace(/\s*slots?/ig,'').trim();hubs=`<strong>${n}</strong> tracks published on Bridge Hubs`;}else if(p.id==='supervisor')hubs='Bridge Talent, Sync, Library & Score included';return `<div class="checkout-size-lines"><div class="checkout-size-line">${optIcon('cloud')}<span>${storage}</span></div><div class="checkout-size-line">${optIcon('team')}<span>${members}</span></div><div class="checkout-size-line">${optIcon('eye')}<span>${hubs}</span></div></div>`};
window.renderFreeSummary=function(p){const s=p.size;return `<div class="checkout-free-summary"><div class="checkout-size-line">${optIcon('cloud')}<span><strong>${s.storage}</strong> storage - <strong>${s.tracks}</strong></span></div><div class="checkout-size-line">${optIcon('team')}<span><strong>${s.members}</strong> members included</span></div><div class="checkout-size-line">${optIcon('eye')}<span>0 tracks published on Bridge Hubs</span></div></div>`};
window.renderCheckoutStack=function(p){const val=selectedPrice(),price=p.enterprise?'Custom':p.free?'Free':fmt(val),suffix=p.sizes?'/mo':'',yearlyLine=p.sizes?(state.yearly?`${fmt(val*12)}/year billed yearly`:`${fmt(val*12)}/year billed monthly`):(p.enterprise?'Talk to sales':'');const sizes=p.sizes?`<div class="checkout-size-tabs" role="tablist" aria-label="${p.badge} sizes">${p.sizes.map((x,i)=>`<button type="button" class="checkout-size-tab" role="tab" aria-selected="${i===state.size}" tabindex="${i===state.size?'0':'-1'}" data-size="${i}">${x.key}</button>`).join('')}</div>${checkoutSizeLines(p,p.sizes[state.size])}`:(p.free?renderFreeSummary(p):'');return `<div class="checkout-stack">${sizes}<div class="checkout-bottom"><div class="checkout-price"><div class="checkout-price-main"><span class="checkout-price-value" aria-live="polite">${price}</span>${suffix?`<span class="checkout-price-suffix">${suffix}</span>`:''}</div>${yearlyLine?`<div class="checkout-price-yearly">${yearlyLine}</div>`:''}</div><div class="checkout-cta-wrap"><button class="pricing-plan-sign-up checkout-cta ${p.enterprise?'secondary':''}" id="mainCta">${p.cta}</button><div class="checkout-reassurance">${p.free?'No card required':p.sizes?'Cancel anytime':''}</div></div></div></div>`};
window.compareValue=function(v){if(v==='Yes')return `<span class="compare-yes" aria-label="Yes">✓</span>`;if(v==='No')return `<span class="compare-no" aria-label="No">—</span>`;return v};
window.renderCompare=function(){const t=document.getElementById('compareTable'),secondary=new Set(['ORGANIZE AND SHARE','INGESTION','ACTIVITY / ANALYTICS','SUPPORT']);let family='',rows='';compareRows.forEach(([f,feature,vals])=>{if(f)family=f;const s=secondary.has(family);if(f)rows+=`<tr class="compare-family ${s?'compare-secondary':''}"><td colspan="6">${f}</td></tr>`;rows+=`<tr class="${s?'compare-secondary':''}"><td class="compare-feature">${feature}</td>${vals.map(v=>`<td>${compareValue(v)}</td>`).join('')}</tr>`});t.innerHTML=`<thead><tr><th class="compare-feature">Feature</th><th><span class="compare-plan-pill free">Free</span></th><th><span class="compare-plan-pill talent">Talent Pro</span></th><th><span class="compare-plan-pill music">Music Pro</span></th><th><span class="compare-plan-pill supervisor">Supervisor / Media Pro</span></th><th><span class="compare-plan-pill enterprise">Enterprise</span></th></tr></thead><tbody>${rows}</tbody>`;const section=t.closest('.full-compare');if(section&&!section.querySelector('.compare-more-btn')){const b=document.createElement('button');b.type='button';b.className='compare-more-btn';b.textContent='Show all features';b.setAttribute('aria-expanded','false');b.onclick=()=>{const e=section.classList.toggle('compare-expanded');b.textContent=e?'Show fewer features':'Show all features';b.setAttribute('aria-expanded',String(e))};section.appendChild(b)}};
renderSummary();renderCompare();
})();
</script>
